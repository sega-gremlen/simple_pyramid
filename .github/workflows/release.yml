name: Release

# Релиз — кнопкой: Actions → Release → Run workflow.
# Версия считается сама из коммитов (git-cliff), changelog из них же попадает
# в GitHub Release и показывается в окне обновления программы.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия вручную (например 1.4.0). Пусто — посчитать по коммитам"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff нужна вся история и теги

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Установка git-cliff
        run: uv tool install git-cliff

      - name: Вычислить версию и changelog
        id: version
        shell: pwsh
        run: |
          $manual = "${{ github.event.inputs.version }}".Trim().TrimStart("v")
          if ($manual) { $v = $manual } else { $v = (git cliff --bumped-version).Trim().TrimStart("v") }
          if (git tag --list "v$v") { throw "Тег v$v уже существует — нет новых feat/fix коммитов?" }
          git cliff --unreleased --tag "v$v" --strip all | Out-File -FilePath CHANGELOG_RELEASE.md -Encoding utf8
          if (-not (Get-Content CHANGELOG_RELEASE.md -Raw).Trim()) { "Мелкие улучшения и исправления" | Out-File CHANGELOG_RELEASE.md -Encoding utf8 }
          # меняем только строку __version__ — остальное в version.py (is_dev_build и т.д.) нужно программе
          $versionFile = "src/simple_pyramid/version.py"
          $text = Get-Content $versionFile -Raw
          $patched = $text -replace '(?m)^__version__ = "[^"]*"', "__version__ = `"$v`""
          if ($patched -eq $text) { throw "В $versionFile не найдена строка __version__" }
          Set-Content $versionFile $patched -NoNewline -Encoding utf8
          "version=$v" >> $env:GITHUB_OUTPUT
          Get-Content CHANGELOG_RELEASE.md

      - name: Установка зависимостей
        run: uv sync --locked

      # после подстановки версии программа должна импортироваться — иначе exe упадёт при запуске
      - name: Проверка версии и импортов
        run: >-
          uv run python -c "import simple_pyramid.desktop.window as _;
          from simple_pyramid.version import __version__, is_dev_build;
          assert __version__ == '${{ steps.version.outputs.version }}', __version__;
          assert not is_dev_build(); print('version', __version__)"

      - name: Сборка PyInstaller
        run: uv run pyinstaller simple_pyramid.spec --noconfirm

      - name: Установка Inno Setup
        run: choco install innosetup --yes

      - name: Компиляция инсталлятора
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/setup.iss
          options: /O+ /DAppVersion=v${{ steps.version.outputs.version }}

      - name: Создать тег и GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          files: installer/Output/simple_pyramid.exe

      - name: Загрузить exe на резервный сервер по SSH
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "deploy_key"
          Set-Content -Path $keyPath -Value $env:DEPLOY_SSH_KEY -NoNewline

          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(F)" | Out-Null

          $sshOpts = @("-i", $keyPath, "-o", "StrictHostKeyChecking=accept-new", "-o", "BatchMode=yes", "-o", "ConnectTimeout=15")

          ssh @sshOpts -p 44448 root@releases.sega-gremlen.top "mkdir -p /home/releases/simple_pyramid"
          if ($LASTEXITCODE -ne 0) { throw "SSH mkdir failed" }

          scp @sshOpts -P 44448 installer/Output/simple_pyramid.exe root@releases.sega-gremlen.top:/home/releases/simple_pyramid/simple_pyramid.exe
          if ($LASTEXITCODE -ne 0) { throw "SCP upload failed" }

          Remove-Item $keyPath -Force
