name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Прописать версию
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "__version__ = `"$v`"" | Out-File -FilePath version.py -Encoding utf8
        shell: pwsh

      - name: Установка зависимостей
        run: |
          pip install pyinstaller
          pip install -r req.txt

      - name: Сборка PyInstaller
        run: pyinstaller --noconsole --onedir --icon=src/favicon.ico --name simple_pyramid --distpath . main.py

      - name: Установка Inno Setup
        run: choco install innosetup --yes

      - name: Компиляция инсталлятора
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: src/setup.iss
          options: /O+ /DAppVersion=${{ github.ref_name }}


      - name: Создать GitHub Release и загрузить файл
        uses: softprops/action-gh-release@v2
        with:
          files: src/Output/simple_pyramid.exe
          generate_release_notes: true

      - name: Загрузить exe на резервный сервер по SSH
        shell: pwsh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "deploy_key"
          Set-Content -Path $keyPath -Value $env:DEPLOY_SSH_KEY -NoNewline

          ssh -i $keyPath -p 44448 -o StrictHostKeyChecking=accept-new root@releases.sega-gremlen.top "mkdir -p /home/releases/simple_pyramid"
          if ($LASTEXITCODE -ne 0) { throw "SSH mkdir failed" }

          scp -i $keyPath -P 44448 -o StrictHostKeyChecking=accept-new src/Output/simple_pyramid.exe root@releases.sega-gremlen.top:/home/releases/simple_pyramid/simple_pyramid.exe
          if ($LASTEXITCODE -ne 0) { throw "SCP upload failed" }

          Remove-Item $keyPath -Force