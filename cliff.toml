# git-cliff: changelog и следующая версия из Conventional Commits.
#   git cliff --bumped-version      → следующая версия (v1.4.0)
#   git cliff --unreleased --strip all → текст «что нового» для релиза
#
# Правила версии (semver):
#   feat:  → новая средняя цифра (1.3.1 → 1.4.0)
#   fix: / perf: → последняя цифра (1.3.1 → 1.3.2)
#   feat!: или BREAKING CHANGE → первая цифра
#   refactor/test/ci/docs/chore/style → версия не меняется (в changelog не попадают)

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat\\(dev\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Новое" },
  { message = "^fix", group = "<!-- 1 -->Исправления" },
  { message = "^perf", group = "<!-- 2 -->Ускорение" },
  { message = "^(refactor|test|ci|docs|chore|style|build)", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
