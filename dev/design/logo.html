<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Иконка — варианты</title>
<style>
body{font-family:"Segoe UI",sans-serif;background:#F3F6FA;color:#13202F;margin:0;padding:24px}
h1{font-size:18px;font-weight:600;margin:0 0 4px} p{color:#566377;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.card{background:#fff;border:.5px solid rgba(15,58,115,.2);border-radius:12px;padding:14px}
h3{font-size:14px;font-weight:600;margin:0 0 10px} h3 span{font-weight:400;color:#8592A6;font-size:12px}
.row{display:flex;align-items:flex-end;gap:18px;padding:12px;border-radius:8px}
.light{background:#F3F6FA} .dark{background:#0F3A73;margin-top:8px}
</style></head><body>
